# Thresholds are in centipawns from the player's point of view unless noted.

[engine]
path = "stockfish"        # overridden by $STOCKFISH
threads = 4
hash_mb = 256
cache = "data/engine_cache.sqlite"
mate_score = 10000        # a mate is scored as this many centipawns
eval_cap = 2000           # evals are clamped to +/- this before comparing

[fetch]
base_url = "https://api.chess.com/pub"
user_agent = "cracktics/0.1 (+https://github.com/chongmindev/cracktics)"  # add contact info here
cache = "data/chesscom_cache"
min_interval = 1.0        # seconds between requests (Chess.com asks for serial, unhurried access)
timeout = 30
retries = 3               # on HTTP 429
backoff = 5.0             # seconds, times the attempt number
months = 2
time_classes = ["rapid"]  # bullet, blitz, rapid, daily; empty list = all

[scan]
# Browser only. A quick pass screens every position at screen_depth and runs the drill rules at full depth
# only on moves within screen_margin of a threshold; a deep pass afterwards completes the exact deck.
screen_depth = 10
screen_margin = 50        # mistakes start at 1 pawn: the screen looks at moves losing half a pawn or more

[report]
depth = 14
error_loss = 100          # a move losing this much is listed as an error
cpl_cap = 1000            # per-move loss is capped at this in the average centipawn loss
hung_min_value = 3        # a captured piece worth this many pawns or more counts as hung
early_queen_moves = 8     # queen moves up to this move number count as early
missed_win_before = 300
missed_win_loss = 200

[summary]
opening_end = 12          # moves up to this are the opening...
middlegame_end = 30       # ...up to this the middlegame, after it the endgame
big_blunder = 300         # a move losing this much counts as a big blunder
opening_plies = 2         # results by opening group games by this many first half-moves

[drills]
depth = 13
multipv = 5
# a puzzle: the position before one of my mistakes, where I find a move as good as the engine's
mistake_min_loss = 100    # my move lost at least this much against the engine's best...
mistake_min_before = -300 # ...I wasn't already lost...
mistake_max_after = 500   # ...and wasn't still winning easily after it
mistake_min_move = 3
accept_within = 50        # an answer counts when it is within this of the engine's best...
accept_min_gain = 75      # ...and beats the move I played by at least this much

[scout]
# Scout: an opponent's opening tree from their finished games
plies = 24                # moves of each game kept in the tree (12 each)
half_life_days = 60       # recent games count more: a game this many days older than their newest counts half (0: all equal)
min_games = 3             # a line needs this many of their games to count as a weak spot
weak_gap = 0.12           # ...and their score there this far below their overall score
weak_spots = 6            # weak spots listed
family_min_games = 3      # openings with fewer of their games are left out of the by-opening table
habit_min_games = 3       # a habit: they reached the position this often...
habit_min_share = 0.5     # ...and played the same move in at least this share of those games
dubious_loss = 50         # centipawns a move gives away against the engine's best: dubious from here...
slip_loss = 100           # ...a mistake (what game plans aim at) from here...
blunder_loss = 250        # ...a blunder from here
slip_depth = 14           # engine depth for judging moves
exploit_min_games = 2     # their moves played at least this often are judged by the engine
move_check_max = 60       # at most this many of their moves judged, most played first
plan_max = 8              # game plans shown: their costliest habits, as full lines
plan_depth = 18           # engine depth for the punishing line of each plan
plan_loss_cap = 500       # in ranking plans, a habit costing more than this counts as this (a lost game is a lost game)

[openings]
# Openings (web only): a quest through every line of an opening, against the moves people really play.
# The book is built once by tools/build_book.py from the Lichess open database (CC0) and committed.
book_month = "2026-09"    # database month read
book_games = 2000000      # rated games counted into the book
book_min_elo = 1200       # both players rated in this range
book_max_elo = 2300
book_min_base = 180       # base time in seconds: blitz and slower (no bullet)
book_plies = 24           # deepest ply counted (12 moves each)
book_min_games = 40       # a position stays in the book with at least this many games
book_depth = 14           # Stockfish depth for every book position
# the quest
answer_tolerance = 40     # your move counts when it is within this many centipawns of the best
side_min_share = 0.04     # an opponent move worth learning to answer: played at least this often...
side_max = 5              # ...at most this many per position, most played first
trap_max_loss = 50        # a trap: a move that costs its player at most this...
trap_reply_loss = 120     # ...where the most played answer to it loses at least this
trap_min_share = 0.002    # rare moves count as traps down to this share
